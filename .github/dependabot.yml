version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      # Keep in step with the dev extra in pyproject.toml. Its pins sit on
      # adjacent lines, and separate bumps of neighbouring pins conflict once
      # either one merges. Runtime dependencies stay out of this group.
      dev-tools:
        patterns: [coverage, mypy, ruff]
