[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-investment-lab"
version = "0.1.0"
description = "Cash-flow and financing model for energy assets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NishikawaButterfly" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage==7.17.2",
  "mypy==2.4.1",
  "ruff==0.17.4",
]

[project.scripts]
investlab = "investlab.cli:main"

[project.urls]
Homepage = "https://github.com/NishikawaButterfly/energy-investment-lab"
Issues = "https://github.com/NishikawaButterfly/energy-investment-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "PTH", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["src/investlab"]
